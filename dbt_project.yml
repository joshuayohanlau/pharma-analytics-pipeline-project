name: 'pharma_analytics'
version: '1.0.0'

profile: 'pharma_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  pharma_analytics:
    +schema: reference
    drug_products:
      +column_types:
        ndc_code: varchar(20)
        unit_price_cents: integer
    therapeutic_classes:
      +column_types:
        class_code: varchar(10)

models:
  pharma_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      core:
        +materialized: table
        +schema: marts
      clinical:
        +materialized: table
        +schema: marts
      commercial:
        +materialized: table
        +schema: marts
    utilities:
      +materialized: ephemeral

snapshots:
  pharma_analytics:
    +target_schema: snapshots

on-run-start:
  - "{{ log_run_event('start') }}"

on-run-end:
  - "{{ log_run_event('end') }}"
